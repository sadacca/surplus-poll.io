queries:
  - id: gpu-search
    label: "Server GPUs"
    enabled: true
    sites: [publicsurplus, govdeals]
    keywords: ["nvidia", "gpu", "tesla"]
    exclude_keywords: ["case", "sleeve"]
    category: "Computer Equipment"
    max_price: 500
    state: "CA"
    zip: "94103"
    radius_miles: 200
    notify: [discord]

  - id: rack-switches
    label: "10G Switches"
    enabled: false
    sites: [publicsurplus]
    keywords: ["switch", "10gbe", "sfp+"]
    max_price: 150
    notify: [discord, slack]
